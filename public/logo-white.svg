<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" role="img" aria-label="MOB'SS">

  <!-- Badge icône (contour blanc + fond transparent) -->
  <rect x="0" y="5" width="54" height="54" rx="12" fill="rgba(255,255,255,0.15)"/>
  <rect x="0" y="0" width="54" height="54" rx="12" fill="rgba(255,255,255,0.25)"/>
  <text x="27" y="37"
    font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="28" font-weight="800" fill="#ffffff"
    text-anchor="middle" letter-spacing="0.5">M</text>

  <!-- Wordmark MOB'SS blanc -->
  <text x="68" y="35"
    font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="26" font-weight="800" font-style="italic" fill="#ffffff"
    letter-spacing="1">MOB'SS</text>

  <!-- Tagline blanc semi-transparent -->
  <text x="69" y="50"
    font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="10.5" font-weight="400" fill="rgba(255,255,255,0.7)"
    letter-spacing="1.5">mobile · sport · santé</text>

</svg>
